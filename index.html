<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Skincare Revolution</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

  <body>
    <div class="hero">
      <img
        src="https://assets.website-files.com/5f040c8ad0b82a728ec61a1e/5f20ebeb69a12b8e50d2653b_skinlabs_logo.svg"
        class="nav-logo"
        alt="Skinlabs logo"
      >
      <div class="hero-background">
        <div class="uppercase-text">
          REFLECTION IN MODERNITY
        </div>
        <br>
        <div class="hero-text">
          The skincare Revolution
        </div>
      </div>
    </div>

    <div class="products-section">
      <h2 class="top-heading">
        Featured products
      </h2>
    </div>

    <div class="divide-container">
      <div class="filter-wrapper">
        <div class="links-container">
          <a href="#clean" class="filter-link active">Clean</a>
          <a href="#treat" class="filter-link">Treat</a>
          <a href="#moisturize" class="filter-link">Moisturize</a>
        </div>
      </div>
    </div>

    <div class="first-section" id="clean">
      <div class="subheading">
        <h2 class="first-subheading">
          Best selling cleansers
        </h2>
      </div>
      <div class="first-container js-products-grid"
          data-category="clean">
      </div>
    </div>

    <div class="first-section" id="treat">
      <div class="subheading">
        <h2 class="second-subheading">
          Treatment solutions
        </h2>
      </div>
      <div class="first-container js-products-grid"
          data-category="treat">
      </div>
    </div>

    <div class="first-section" id="moisturize">
      <div class="subheading">
        <h2 class="third-subheading">
          For moisturized skin
        </h2>
      </div>
      <div class="first-container js-products-grid"
          data-category="moisturize">
      </div>
    </div>

    <div>
      <div>
        <h1 class="finalheading">
          We're Social
        </h1>
        <p class="finalpara">
          Join our community of skincare junkies like you who know that a great skincare routine goes a long way.
        </p>
        <button class="socialbtn">
          FIND US ON SOCIAL
          <span class="htmlentity">&rarr;</span>
        </button>
      </div>
    </div>
